# The overnight "daily job" (and the course-video finder) for Learning Galaxy.
# Claude Code runs headless with web search and edits the learner's cloud data through scripts/db.mjs.
#
# Secrets (Settings > Secrets and variables > Actions):
#   CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) or ANTHROPIC_API_KEY
#   SUPABASE_URL, SUPABASE_SERVICE_KEY (service_role key). LG_USER_ID only if several users exist.
#
# Triggers: every morning 06:30 IST; a new course (the app opens an issue titled "Course: …", opened by the repo owner);
# the app (⚡ App > Builder > Run … now); or Actions > Run workflow.
# Courses are always written by Claude Code here, never by an AI key in the app.
name: Cloud job

on:
  schedule:
    - cron: '0 1 * * *'
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      kind:
        description: daily (everything) or courses (only find course videos)
        required: false
        default: daily

permissions:
  contents: read
  issues: write

concurrency:
  group: cloud-job
  cancel-in-progress: false

jobs:
  run:
    # for issues: only the owner's "Course: …" requests (the issue text itself is never given to Claude)
    if: github.event_name != 'issues' || (startsWith(github.event.issue.title, 'Course:') && github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      LG_USER_ID: ${{ secrets.LG_USER_ID }}
      KIND: ${{ inputs.kind || (github.event_name == 'issues' && 'courses') || 'daily' }}
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check setup
        id: setup
        env:
          HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          missing=""
          [ "$HAS_CLAUDE" = "true" ] || missing="$missing CLAUDE_CODE_OAUTH_TOKEN"
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_SERVICE_KEY" ] || missing="$missing SUPABASE_SERVICE_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing repo secrets:$missing (see docs/SETUP.md)"; exit 1; fi
          if ! node scripts/db.mjs cols; then echo "::notice::No signed-in user yet (sign in once in the app: App > Cloud sync). Skipping today."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: Claude runs the job
        if: steps.setup.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          export TODAY="$(TZ=Asia/Kolkata date +%F)"
          if [ "$KIND" = "courses" ]; then
            PROMPT="$(cat jobs/daily.md)

          ## This run
          Only do steps 0 and 1 (write courses that are still drafts, then find their videos), then step 5 with a one-line digest about the courses. Today is $TODAY."
          else
            PROMPT="$(cat jobs/daily.md)

          ## This run
          Do all steps. Today is $TODAY."
          fi
          npx -y @anthropic-ai/claude-code@latest -p "$PROMPT" \
            --model sonnet --max-turns 150 --permission-mode acceptEdits \
            --allowedTools 'Read,Grep,Glob,Write,WebSearch,WebFetch,Bash(node scripts/db.mjs:*),Bash(cat:*),Bash(ls:*),Bash(date:*),Bash(mktemp:*),Bash(rm /tmp/*)' \
            | tee "$RUNNER_TEMP/out.md"
          echo "### Cloud job ($KIND)" >> "$GITHUB_STEP_SUMMARY"; tail -c 4000 "$RUNNER_TEMP/out.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Report on the course request
        if: github.event_name == 'issues' && always()
        env:
          RESULT: ${{ job.status }}
          SKIP: ${{ steps.setup.outputs.skip }}
        run: |
          if [ "$SKIP" = "true" ]; then
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "ℹ️ There is no signed-in user in your cloud database yet, so Claude had nowhere to save the course. Sign in once in the app (⚡ App → Cloud sync), then re-run this from the Actions tab (Cloud job → Run workflow, kind: courses) or wait for the morning run." || true
          elif [ "$RESULT" = "success" ]; then
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "✅ Claude wrote the course and saved it to your app. Open the app (it syncs on open) and look under Courses. [Run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" && gh issue close "$ISSUE" -R "$GITHUB_REPOSITORY" || true
          else
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "⚠️ Claude could not finish this course. See the [run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID); the morning run will try again." || true
          fi
