# Refreshes the public Radar feed (app/feed/latest.json) every morning: GitHub trending, AI news,
# AI tools and YouTube videos. Step 1 gathers what people are actually discussing (Reddit, Hacker News,
# GitHub, Polymarket) with the last30days skill; step 2 has Claude Code combine that with web research;
# the result is validated, committed to main, and Netlify deploys it. Needs only CLAUDE_CODE_OAUTH_TOKEN.
#
# Security: last30days is third-party code. It runs in its own step WITHOUT any secrets, pinned to a
# reviewed commit, and Claude only receives its text output as untrusted data.
name: Daily feed

on:
  schedule:
    - cron: '30 0 * * *'   # 06:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-feed
  cancel-in-progress: false

env:
  # mvanhorn/last30days-skill v4.6.0 (MIT). To upgrade: review the diff, then change this SHA.
  LAST30DAYS_SHA: 64b1f006f800640022ce07f51de5ce56aad34b76

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Community signals (last30days, no secrets)
        continue-on-error: true
        # no secrets are available to this step: only the default read-only checkout token, which we drop below
        env:
          GITHUB_TOKEN: ''
        run: |
          set -uo pipefail
          mkdir -p signals
          export HOME="$RUNNER_TEMP/l30home"; mkdir -p "$HOME"
          git init -q "$RUNNER_TEMP/l30" && cd "$RUNNER_TEMP/l30"
          git fetch -q --depth 1 https://github.com/mvanhorn/last30days-skill.git "$LAST30DAYS_SHA" && git checkout -q FETCH_HEAD
          [ "$(git rev-parse HEAD)" = "$LAST30DAYS_SHA" ] || { echo "::warning::last30days checkout does not match the pinned commit; skipping"; exit 0; }
          cd "$GITHUB_WORKSPACE"
          n=0
          while IFS= read -r topic; do
            topic="${topic%%#*}"; topic="$(echo "$topic" | xargs)"; [ -z "$topic" ] && continue
            n=$((n+1)); slug="$(printf '%02d-%s' "$n" "$(echo "$topic" | tr -c 'a-zA-Z0-9' '-' | cut -c1-40)")"
            timeout 240 python3 "$RUNNER_TEMP/l30/skills/last30days/scripts/last30days.py" "$topic" \
              --emit json --quick --research-only --no-browser-cookies --search reddit,hackernews,github,polymarket \
              2> "signals/$slug.err" | head -c 150000 > "signals/$slug.json" || true
            printf '%s\n' "$topic" > "signals/$slug.topic"
            echo "signals for '$topic': $(wc -c < "signals/$slug.json") bytes"
          done < jobs/signals.txt
          rm -f signals/*.err

      - name: Claude researches today's feed
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          export TODAY="$(TZ=Asia/Kolkata date +%F)"
          cp app/feed/latest.json "$RUNNER_TEMP/previous.json"
          npx -y @anthropic-ai/claude-code@latest -p "$(cat jobs/feed.md)

          Today is $TODAY." \
            --model sonnet --max-turns 90 --permission-mode acceptEdits \
            --allowedTools 'Read,Glob,Grep,Write,Edit,WebSearch,WebFetch,Bash(node scripts/validate-feed.mjs:*),Bash(date:*)' \
            | tee "$RUNNER_TEMP/out.md"

      - name: Validate (keep yesterday's feed if today's is broken)
        run: |
          if ! node scripts/validate-feed.mjs; then
            echo "::warning::Today's feed failed validation; keeping the previous feed."
            cp "$RUNNER_TEMP/previous.json" app/feed/latest.json
            exit 1
          fi

      - name: Publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/feed/latest.json
          if git diff --cached --quiet; then echo "Feed unchanged."; exit 0; fi
          git commit -q -m "feed: $(node -e 'console.log(JSON.parse(require("fs").readFileSync("app/feed/latest.json","utf8")).date)') radar update"
          git pull -q --rebase origin "${{ github.event.repository.default_branch }}"
          git push -q origin HEAD:"${{ github.event.repository.default_branch }}"
          { echo "### Daily feed"; node scripts/validate-feed.mjs; tail -c 1500 "$RUNNER_TEMP/out.md"; } >> "$GITHUB_STEP_SUMMARY"
